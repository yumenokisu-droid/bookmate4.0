<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOOKMATE LIVE ROOM</title>
  <link rel="stylesheet" href="meeting.css" />
</head>
<body class="live-body">
  <div class="live-shell-v2">
    <header class="live-header-v2">
      <a href="index.html" class="back-link">← BOOKMATE로 돌아가기</a>
      <div>
        <p class="eyebrow">우리의 문학 LIVE</p>
        <h1>『작별인사』 독서토론</h1>
      </div>
      <div class="live-header-actions">
        <span class="status-pill live" id="liveStatusPill">LIVE 준비중</span>
        <strong id="liveClock">00:00</strong>
      </div>
    </header>

    <main class="live-main-v2">
      <section class="live-chat-main card">
        <div class="live-chat-title">
          <div>
            <p class="eyebrow">대화 중심 LIVE ROOM</p>
            <h2>💬 LIVE 대화</h2>
          </div>
          <button class="small-button" id="simulateVoiceBtn">음성 발언 요약 예시</button>
        </div>
        <div id="liveChatStream" class="live-chat-stream"></div>
        <form id="liveRoomForm" class="live-input-bar">
          <button type="button" class="icon-btn" id="emojiBtn">😊</button>
          <button type="button" class="icon-btn" id="attachBtn">📎</button>
          <input id="liveRoomInput" placeholder="메시지를 입력하세요. 예: 모아야, 다음 질문 부탁해" autocomplete="off" />
          <button type="button" class="icon-btn" id="micBtn">🎤</button>
          <button class="primary-button" type="submit">보내기</button>
        </form>
      </section>

      <aside class="live-sidebar-v2">
        <section class="card compact-panel">
          <h3>🤖 AI 역할</h3>
          <label><input type="radio" name="liveAiRole" value="퍼실리테이터" checked> 퍼실리테이터</label>
          <label><input type="radio" name="liveAiRole" value="보조"> 보조</label>
          <label><input type="radio" name="liveAiRole" value="없음"> AI 없음</label>
          <p class="muted" id="roleDesc">AI가 발제문, 발언순서, 시간관리, 참여유도를 자연스럽게 진행합니다.</p>
        </section>

        <section class="card compact-panel master-panel">
          <h3>모임장 AI 제어</h3>
          <button class="primary-button full" id="nextPromptBtn">다음 발제문</button>
          <button class="small-button full" id="summaryBtn">현재까지 요약</button>
          <button class="small-button full" id="balanceBtn">발언 균형</button>
          <button class="small-button full" id="encourageBtn">참여 유도</button>
          <button class="danger-button full" id="finishBtn">종료 리포트 생성</button>
        </section>

        <section class="card compact-panel">
          <h3>🎤 음성 보조</h3>
          <label class="toggle-row"><input type="checkbox" id="voiceSummaryToggle" checked> AI 음성인식 요약</label>
          <label class="toggle-row"><input type="checkbox" id="voiceRecordToggle"> 음성 기록 저장</label>
          <p class="muted">음성으로 말한 내용을 AI가 1인칭 요약으로 채팅 흐름에 올립니다.</p>
        </section>

        <section class="card compact-panel">
          <h3>👥 참여자</h3>
          <div id="participantList" class="participant-list"></div>
          <h3>✋ 발언순서</h3>
          <ol id="speakerQueue" class="speaker-queue"></ol>
        </section>
      </aside>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="live.js"></script>
</body>
</html>
